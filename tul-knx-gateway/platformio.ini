[platformio]
src_dir = src
include_dir = include

[env]
# Pinned to the pioarduino fork (Arduino-ESP32 core 3.x + ESP32-C6 support +
# the split-out Network library). The bare "espressif32" name resolves to the
# official platformio/platform-espressif32, which lacks C6 Arduino support and
# the Network lib on a fresh install (GitHub #1). Version matches the v1.4.4
# release build (Arduino core 3.3.7, IDF 5.5).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
extra_scripts = pre:scripts/version_bump.py

# Dual-OTA layout: two ~1.94 MB app slots + 64 KB coredump, no SPIFFS.
# Anti-brick rollback path lives at offset 0x200000.
board_build.partitions = partitions_4mb_ota.csv
board_upload.flash_size = 4MB

lib_deps =
    Network
    WiFi
    ESP32Async/ESPAsyncWebServer @ 3.6.0
    ESP32Async/AsyncTCP @ 3.3.2
    https://github.com/tostmann/improv-wifi-busware.git

# Build flags
build_flags =
    -DMASK_VERSION=0x091A
    -DKNX_TUNNELING=10
    -DKNX_ROUTING
    -DKNX_BAUDRATE=38400
    -DNCN5120
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src"

[env:tul_esp32c3]
board = seeed_xiao_esp32c3
build_flags =
    ${env.build_flags}
    -I"${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32c3/include/esp_wifi/include"
    -DKNX_LED=4
    -DKNX_BUTTON=9
    -DKNX_SERIAL=Serial0
    -DKNX_RX_PIN=20
    -DKNX_TX_PIN=21

[env:tul32_esp32c6]
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -I"${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32c6/include/esp_wifi/include"
    -DKNX_LED=8
    -DKNX_BUTTON=9
    -DKNX_SERIAL=Serial0
    -DKNX_RX_PIN=5
    -DKNX_TX_PIN=4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_filters = esp32_exception_decoder

# TULX32: hardware-identical to TUL32 but no external USB connector. KNX runs
# on UART_NUM_1 (hardcoded in main.cpp) → GPIO 4/5; UART0 default IOMUX pins
# (GPIO 16/17) are broken out via service header J1 (FH34SRJ-14S) for CP2102N
# bringup + log capture. Therefore: disable HWCDC so Serial routes to UART0,
# making logs visible on the CP2102N. Improv-Serial stays enabled in production
# (no-op when no CP2102N is attached, but allows re-provisioning by plugging
# one in) — costs ~9 KB flash and ~2 s boot delay.
[env:tulx32_esp32c6]
extends = env:tul32_esp32c6
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${env:tul32_esp32c6.build_flags}
